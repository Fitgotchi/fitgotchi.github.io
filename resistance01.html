<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="resistance01.css">
    <title>FitGotchi - Resistencia Básica</title>
</head>
<body>
    <div class="container">
        <h1>Resistencia Básica</h1>
        <p>Elige una rutina para mejorar la resistencia de tu FitGotchi.</p>

        <div id="exerciseExecution" class="exercise-execution hidden">
            <h2 id="exerciseName"></h2>
            <div class="circle-timer">
                <svg width="100" height="100">
                    
                    <circle cx="50" cy="50" r="45" stroke="#39ff14" stroke-width="5" fill="none"></circle>
                    
                    <circle id="progressCircle" cx="50" cy="50" r="45" 
                        stroke="#b409ed" stroke-width="5" fill="none" 
                        stroke-dasharray="283" stroke-dashoffset="283"
                        transform="rotate(180 50 50)">
                    </circle>
                </svg>
                                
                <div id="timerText" class="timer-text">30s</div>
            </div>
        </div>

        <div id="routineSelection" class="exercise-options">
            <button class="exercise-btn" onclick="startRoutine('routine1')">Flexiones Suaves</button>
            <button class="exercise-btn" onclick="startRoutine('routine2')">Sentadillas Lentas</button>
            <button class="exercise-btn" onclick="startRoutine('routine3')">Planchas Cortas</button>
        </div>

        <div class="back-button">
            <button onclick="window.location.href='resistance.html'">Volver a Resistencia</button>
        </div>

        <div class="nav-bar">
            <button onclick="navigateTo('index')">Home</button>
            <button onclick="navigateTo('exercise')">Ejercicio</button>
            <button onclick="navigateTo('store')">Tienda</button>
        </div>
    </div>
    <script src="resistance01.js"></script>
</body>
</html>
