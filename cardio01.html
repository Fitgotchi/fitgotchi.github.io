<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cardio01.css">
    <title>FitGotchi - Cardio</title>
</head>
<body>
    <div class="container">
        <h1>Cardio</h1>
        <p>Inicia tu rutina para mejorar tu resistencia cardiovascular.</p>
        <div class="instructions">
            <h2>Instrucciones</h2>
            <p id="instruction-display">¡Prepárate para comenzar! 🚀</p>
        </div>
        <div class="timer-container">
            <div class="circular-progress" id="circular-progress"></div>
            <p id="time-display">05:00</p>
            <button id="start-stop-button">Iniciar</button>
            <button id="reset-button">Reiniciar</button>
            <button id="end-button">Finalizar</button>
        </div>
        
        <div class="rewards">
            <h2>Recompensas</h2>
            <div class="reward-item">
                <label for="experience">Experiencia:</label>
                <input type="number" id="experience" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="coins">Monedas:</label>
                <input type="number" id="coins" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="calories">Calorías:</label>
                <input type="number" id="calories" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="speed">Velocidad:</label>
                <input type="number" id="speed" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="cardio">Cardio:</label>
                <input type="number" id="cardio" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="endurance">Resistencia:</label>
                <input type="number" id="endurance" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="strength">Fuerza:</label>
                <input type="number" id="strength" value="0" readonly>
            </div>
            <div class="reward-item">
                <label for="agility">Agilidad:</label>
                <input type="number" id="agility" value="0" readonly>
            </div>
        </div>
        
        <div class="nav-bar">
            <button onclick="navigateTo('index')">Home</button>
            <button onclick="navigateTo('exercise')">Ejercicio</button>
            <button onclick="navigateTo('store')">Tienda</button>
            
        </div>
    </div>
    <script src="cardio01.js"></script>
</body>
</html>
