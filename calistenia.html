<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calistenia.css">
    <title>FitGotchi - Calistenia</title>
</head>
<body>
    <div class="container">
        <h1>Rutinas de Calistenia</h1>
        <div class="routine-cards">
            <div class="card">
                <h2>Principiante</h2>
                <p>Rutina de bajo impacto para iniciarte en la calistenia.</p>
                <button onclick="startRoutine('beginner')">Comenzar</button>
            </div>
            <div class="card">
                <h2>Intermedio</h2>
                <p>Aumenta la intensidad con ejercicios más desafiantes.</p>
                <button onclick="startRoutine('intermediate')">Comenzar</button>
            </div>
            <div class="card">
                <h2>Avanzado</h2>
                <p>Domina la calistenia con rutinas de alto nivel.</p>
                <button onclick="startRoutine('advanced')">Comenzar</button>
            </div>
        </div>
        <div class="nav-bar">
            <button onclick="navigateTo('index')">Home</button>
            <button onclick="navigateTo('exercise')">Ejercicio</button>
            <button onclick="navigateTo('store')">Tienda</button>
        </div>
    </div>
    <script src="calistenia.js"></script>
</body>
</html>
