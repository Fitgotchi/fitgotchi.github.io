<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitGotchi</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;700&display=swap" />
</head>
<body>
  <div class="container">
    <h1 class="app-title">FitGotchi</h1>

    <div class="fitcoin-display">
      💰 FitCoins: <span id="fitcoins-count">0</span>
    </div>

    <input type="text" id="fitgotchi-name" placeholder="Nombre de tu FitGotchi" onchange="updateName()" />
    <span id="serial-number">N° 001</span>

    <!-- Avatar visual -->
    <div class="avatar-container">
      <img id="fitgotchi-avatar" src="img/fitgotchi_base.png" alt="Tu FitGotchi" />
    </div>

    <!-- Misiones diarias -->
    <div id="daily-missions">
      <h2>📅 Misiones de hoy</h2>
      <ul>
        <li id="mission1">Ejercítate 1 vez - ⏳</li>
        <li id="mission2">Duerme al menos 7 horas - ⏳</li>
      </ul>
    </div>

    <!-- Stats principales -->
    <div class="fitgotchi-stats">
      <label for="level">Nivel:</label>
      <progress id="level" value="10" max="100"></progress>
      <label for="experience">Experiencia:</label>
      <progress id="experience" value="30" max="100"></progress>
    
      <!-- Botones clave aquí -->
      <div class="key-actions">
        <button id="play-button">🏃 Ejercitarse</button>
        <button id="feed-button">🍎 Alimentar</button>
        <button id="sleep-button">💤 Registrar Sueño</button>
        <button onclick="navigateTo('missions')">📅 Misiones</button>
      </div>
    
      <label>Velocidad:</label>
      <input type="number" id="speed" value="1" readonly />
      <label>Cardio:</label>
      <input type="number" id="cardio" value="2" readonly />
      <label>Resistencia:</label>
      <input type="number" id="endurance" value="3" readonly />
      <label>Fuerza:</label>
      <input type="number" id="strength" value="4" readonly />
      <label>Agilidad:</label>
      <input type="number" id="agility" value="2" readonly />
    </div>
    

    <!-- Métricas -->
    <div class="metrics">
      <div class="metric">
        <label for="energy">⚡ Energía:</label>
        <progress id="energy" value="80" max="100"></progress>
      </div>
      <div class="metric">
        <label for="hunger">🍔 Hambre:</label>
        <progress id="hunger" value="50" max="100"></progress>
      </div>
      <div class="metric">
        <label for="sleep">💤 Sueño:</label>
        <progress id="sleep" value="70" max="100"></progress>
      </div>
      
    </div>

    <!-- Acciones -->
    <div class="actions">
      <button onclick="navigateTo('rewards')">🎁 Recompensas</button>
    </div>

    <div class="actions">
      <button onclick="navigateTo('freework')">🎯 Entrenamiento Libre</button>
      <button onclick="navigateTo('pose')">🧘 Poses</button>
      <button onclick="navigateTo('history')">📈 Historial</button>
      <button onclick="logout()">🔒 Cerrar sesión</button>
    </div>
    </div>
  </div>

  <!-- Barra de navegación -->
  <div class="nav-bar">
    <button onclick="navigateTo('index')">🏠</button>
    <button onclick="navigateTo('exercise')">💪</button>
    <button onclick="navigateTo('store')">🛒</button>
  </div>

  <!-- Alerta flotante -->
  <div id="fitgotchi-alert" class="alert-hidden"></div>

  <script src="script.js"></script>
</body>
</html>
